function saveLocal(){const key=cacheKey(),current=storageGet(key);if(storageConflict||(localSeen.has(key)&&localSeen.get(key)!==current)){storageConflict=true;storageError='另一個分頁已更新這趟旅行，已暫停覆寫。請先匯出此分頁備份，再重新整理。';renderStatus();return false;}const text=stable({data,dirty,base,updated:new Date().toISOString()}),ok=storageSet(key,text);if(ok){localSeen.set(key,text);lastSaved=new Date().toISOString();storageError='';}else{storageError='這次變更尚未存到裝置：瀏覽器空間不足或不允許保存。請立即匯出備份。';}renderStatus();return ok;}
function commit(message='',before=null){revision++;dirty=true;if(before)undo={data:before,revision};else undo=null;saveLocal();render();if(message)toast(message,!!before);if(cloud.password&&!storageConflict){cloud.state='pending';clearTimeout(saveTimer);saveTimer=setTimeout(()=>syncCloud(),900);renderStatus();}}
function toast(message,canUndo=false){clearTimeout(toastTimer);$('#toast').innerHTML=`<span>${esc(message)}</span>${canUndo?'<button data-action="undo">復原</button>':''}`;$('#toast').classList.remove('hide');toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),canUndo?14000:5000);}
function renderStatus(){const s=cloud.conflict?'有同步衝突':cloud.busy?'雲端同步中':!navigator.onLine?'離線・裝置保存':storageError?'尚未成功保存':cloud.error?'雲端待重試':cloud.id&&!cloud.password?'雲端快取・請連線':cloud.password?(dirty?'變更待同步':'雲端已同步'):'已存於此裝置';const warn=storageError||cloud.error||cloud.conflict;$('#sync-status').setAttribute('aria-label','資料保存與雲端設定：'+s);$('#sync-status').innerHTML=`<span class="dot ${warn?'error':dirty&&cloud.id?'warn':''}"></span><span class="status-text">${s}</span>`;$('#storage-alert').classList.toggle('hide',!storageError);$('#storage-alert').textContent=storageError;}

function renderPlan(){

 return pageHeading(data.city,`<button class="btn yellow" data-action="add-item">${icon('plus')}加入行程</button>`,true)+
 `<div class="date-toolbar"><span>${esc(data.days[0].date.slice(0,4))} 年 · ${data.days.length} 個旅行日</span><button class="btn light small" data-action="dates">${icon('calendar')}管理日期</button></div><div class="date-scroll" role="group" aria-label="選擇旅行日期">${data.days.map(d=>`<button class="day-btn" data-action="date" data-date="${d.date}" aria-pressed="${ui.date===d.date}" aria-label="${d.date} ${weekday(d.date)}"><span class="day-week">${weekday(d.date)}</span><span class="day-number">${Number(d.date.slice(5,7))}/${Number(d.date.slice(8,10))}</span><span class="day-total">${data.itinerary.filter(i=>i.date===d.date).length} 個行程</span></button>`).join('')}</div>

function renderItem(i,n,withDate){i=activeItem(i);const cat=categories[i.category]||categories.sight;return `<article class="timeline-item"><span class="timeline-time">${esc(i.time||'未定')}</span><span class="timeline-dot" aria-hidden="true"></span><div class="item-card ${i.done?'done':''} ${i.rain?'has-rain':''}" ${i.rain?`data-swipe-id="${esc(i.id)}" tabindex="0" role="group" aria-label="${esc(i.place)}，左右滑動或使用方向鍵切換原案與雨天備案"`: ''}>${i.rain?`<div class="plan-selector" role="group" aria-label="選擇行程方案">${[['original','原案'],['rain','☂ 雨天備案']].map(([plan,label])=>`<button data-action="choose-plan" data-id="${esc(i.id)}" data-plan="${plan}" aria-pressed="${(i.activePlan||'original')===plan}">${label}</button>`).join('')}</div><div class="swipe-hint">← 左右滑動切換 →</div>`:''}<div class="row between"><span class="badge ${cat[1]}">${cat[0]}${withDate?' · '+dateText(i.date):''}</span><button class="icon-btn no-print" data-action="edit-item" data-id="${esc(i.id)}" aria-label="編輯 ${esc(i.place)}">${icon('edit')}</button></div><h3 class="place-title">${esc(i.place)}</h3>${i.address?`<div class="item-meta">${icon('pin')} ${esc(i.address)}</div>`:''}${i.note?`<p class="item-note">${esc(i.note)}</p>`:''}${i.duration||i.cost?`<div class="item-meta row wrap">${i.duration?`<span>${icon('clock')} 停留 ${durationText(i.duration)}</span>`:''}${i.cost?`<span>預估 ${money(i.cost)}</span>`:''}</div>`:''}${i.shopping.length?`<div class="mini-shopping"><div class="row between"><b>要買的東西</b><span>${i.shopping.filter(b=>b.done).length} / ${i.shopping.length}</span></div>${i.shopping.slice(0,3).map(b=>`<label><input type="checkbox" data-action="buy" data-item="${esc(i.id)}" data-id="${esc(b.id)}" ${b.done?'checked':''}><span class="${b.done?'struck':''}">${esc(b.text)}</span></label>`).join('')}${i.shopping.length>3?`<button class="text-btn" data-action="shopping-item" data-id="${esc(i.id)}">還有 ${i.shopping.length-3} 件，查看全部 →</button>`:''}</div>`:''}<div class="item-bottom no-print"><div class="row gap8" function renderShopping(){const all=allBuys(),done=all.filter(b=>b.done).length,filtered=all.filter(b=>ui.shoppingFilter==='all'||(ui.shoppingFilter==='todo'?!b.done:b.done));return pageHeading('購物清單',`<button class="btn yellow" data-action="add-buy">${icon('plus')}加一件</button>`)+`<div class="card"><div class="row between"><div><div class="eyebrow muted">SHOPPING LIST</div><h2 style="margin-top:6px">${done} <small class="muted">/ ${all.length} 件已入袋</small></h2></div><div class="empty-art" style="width:50px;height:50px;border-radius:17px;margin:0">${icon('bag')}</div></div><div class="progress"><span style="width:${all.length?done/all.length*100:0}%"></span></div><p class="small muted">${all.length&&done===all.length?'清單全數完成，記得留一點行李空間。':`${all.length-done} 件還沒買，逛街時不怕漏掉。`}</p></div><div class="chips" role="group" aria-label="購物清單篩選">${[['all','全部',all.length],['todo','待購買',all.length-done],['done','已購買',done]].map(([id,t,n])=>`<button class="chip" data-action="buy-filter" data-filter="${id}" aria-pressed="${ui.shoppingFilter===id}">${t} ${n}</button>`).join('')}</div>${filtered.length?`<div class="card">${filtered.map(b=>`<div class="shopping-row"><label><input type="checkbox" data-action="buy" data-item="${esc(b.itemId)}" data-id="${esc(b.id)}" ${b.done?'checked':''}><span><span class="buy-text ${b.done?'struck':''}">${esc(b.text)}</span><span class="buy-detail block">${dateText(b.date)} · ${esc(b.place)}</span></span></label><button class="icon-btn" data-action="edit-item" data-id="${esc(b.itemId)}" aria-label="編輯 ${esc(b.place)} 的購物清單">${icon('chevron')}</button></div>`).join('')}</div>`:emptyCard('bag',all.length?'這裡已經清空了':'讓伴手禮有個家。',all.length?'切換上方篩選，查看其他商品。':'把商品加到預計會去的店家，行程和購物就能一起看。',!all.length?'<button class="btn primary" data-action="add-buy">＋ 加入想買的東西</button>':'')}`;}
function settlements(){const out=[];for(const cur of ['JPY','TWD']){const factor=cur==='JPY'?1:100,balances=new Map(data.people.map(p=>[p.id,0]));for(const e of data.expenses.filter(e=>e.currency===cur)){const amount=Math.round(e.amount*factor),share=Math.floor(amount/e.involved.length),remainder=amount%e.involved.length;balances.set(e.payer,balances.get(e.payer)+amount);e.involved.forEach((pid,n)=>balances.set(pid,balances.get(pid)-share-(n<remainder?1:0)));}const debt=[...balances].filter(([,v])=>v<0).map(([id,v])=>({id,n:-v})),credit=[...balances].filter(([,v])=>v>0).map(([id,v])=>({id,n:v}));let i=0,j=0;while(i<debt.length&&j<credit.length){const n=Math.min(debt[i].n,credit[j].n);out.push({from:personName(debt[i].id),to:personName(credit[j].id),amount:n/factor,currency:cur});debt[i].n-=n;credit[j].n-=n;if(!debt[i].n)i++;if(!credit[j].n)j++;}}return out;}

{e.note?`<p class="item-note">${esc(e.note)}</p>`:''}${e.photoPath&&!photoSrc(e)?'<p class="help">照片需連線雲端後載入。</p>':''}</div></div><div class="row between no-print" style="margin-top:10px"><span class="badge">${e.currency}</span><button class="text-btn" data-action="edit-expense" data-id="${esc(e.id)}">${icon('edit')} 編輯支出</button></div></article>`).join('')}`).join(''):emptyCard('wallet','第一筆，從這裡開始。','餐費、交通、住宿，記下誰先付，就能自動算出分帳。','<button class="btn primary" data-action="add-expense">＋ 記一筆支出</button>')}</section><aside class="expense-aside stack"><section class="card cream"><div class="eyebrow muted">SETTLEMENT</div><h3 style="margin-top:6px">最後這樣付</h3>${pay.length?pay.map(s=>`<div class="settlement"><span><b>${esc(s.from)}</b><br><span class="muted">→ ${esc(s.to)}</span></span><b class="settlement-money">${money(s.currency==='JPY'?asTwd(s.amount):s.amount,'TWD')}</b></div>`).join(''):'<p class="small muted" style="margin-top:16px">目前帳目已平衡。</p>'}<p class="balance-note">此處金額皆為新台幣。日圓分帳依固定匯率 1 日圓＝NT$0.20 換算，請依上列金額付款給代墊旅伴。日圓原始總額顯示於上方費用卡片。均分餘額依旅伴勾選順序分配。</p></section><button class="btn light full" data-action="export-csv">${icon('download')}匯出支出 CSV</button></aside></div>`;}

function collectItem(form){const f=new FormData(form),place=f.get('place').trim(),date=f.get('date'),cost=Number(f.get('cost')||0),duration=readDuration(f,'duration');if(!place||!validDate(date))throw Error('請填入有效日期與地點。');if(!Number.isFinite(cost)||cost<0||!Number.isInteger(cost)||cost>1e9)throw Error('日圓預估請填入 0 至 10 億的整數。');if(!Number.isInteger(duration)||duration<0||duration>1440)throw Error('停留時間請填入 0 至 1440 分鐘。');const rain=normalizeRain({place:f.get('rain-place'),address:f.get('rain-address'),note:f.get('rain-note'),cost:f.get('rain-cost'),duration:readDuration(f,'rain-duration'),done:f.has('rain-done')});const prior=data.itinerary.find(i=>i.id===modalItemId);return {id:modalItemId||uid(),rain,activePlan:rain&&prior?.activePlan==='rain'?'rain':'original',date,time:f.get('time'),place,address:f.get('address').trim(),category:f.get('category'),cost,duration,note:f.get('note').trim(),done:f.has('done'),shopping:$$('.sheet-shopping',form).map(row=>({id:row.dataset.buyId,text:$('input',row).value.trim(),done:row.dataset.done==='1'})).filter(b=>b.text)};}
function saveItem(form){try{const record=collectItem(form),n=data.itinerary.findIndex(i=>i.id===record.id);if(n>=0)data.itinerary[n]=record;else data.itinerary.push(record);if(!data.days.some(d=>d.date===record.date)){data.days.push({date:record.date});data.days.sort((a,b)=>a.date.localeCompare(b.date));}ui.date=record.date;ui.search='';closeSheet(true);commit(n>=0?'行程已更新':'新的一站，收好了。');}catch(e){formError(e.message);}}
async function deleteItem(id){const i=data.itinerary.find(i=>i.id===id);if(!i)return;if(!await ask('刪除這個行程？',`「${i.place}」與它的 ${i.shopping.length} 件購物項目會一起刪除。刪除後可按「復原」。`,'刪除行程'))return;const before=clone(data);data.itinerary=data.itinerary.filter(i=>i.id!==id);closeSheet(true);commit('行程已刪除',before);}
function openDates(){openSheet('安排旅行日期',`<p class="help" style="margin-top:0">新增一天或連續多天；既有行程會保留。</p><form id="date-form" class="form-section"><div class="grid2">${field('start','開始日期',ui.date,'date','required')}${field('end','結束日期 <em>單日可留白</em>','','date')}</div>${errorBox()}<button class="btn primary full form-section" type="submit">加入日期</button></form><hr class="section-divider"><h3>目前的旅行日</h3><div>${data.days.map(d=>`<div class="date-manager-row"><div><b>${dateText(d.date,true)} ${weekday(d.date)}</b><span class="small block">${data.itinerary.filter(i=>i.date===d.date).length} 個行程</span></div><button class="icon-btn" data-action="delete-date" data-date="${d.date}" aria-label="刪除 ${d.date}">${icon('trash')}</button></div>`).join('')}</div>`,'dates');}
function saveDates(form){const f=new FormData(form),start=f.get('start'),end=f.get('end')||start;if(!validDate(start)||!validDate(end)||end<start){formError('結束日期不能早於開始日期。');return;}const count=Math.round((Date.parse(end)-Date.parse(start))/86400000)+1;if(count>90){formError('一次最多加入 90 天。');return;}const dates=new Set(data.days.map(d=>d.date));for(let n=0;n<count;n++)dates.add(new Date(Date.parse(start)+n*86400000).toISOString().slice(0,10));if(dates.size>366){formError('一趟旅行最多 366 個日期。');return;}data.days=[...dates].sort().map(date=>({date}));ui.date=start;closeSheet(true);commit('旅行日期已更新');}
async function deleteDate(date){if(data.days.length===1){toast('至少保留一個旅行日期。');return;}const count=data.itinerary.filter(i=>i.date===date).length;if(!await ask('刪除這個旅行日？',`${dateText(date,true)} 的 ${count} 個行程與所附購物清單會一起刪除。已記錄的支出會保留。`,'刪除日期'))return;const before=clone(data);data.days=data.days.filter(d=>d.date!==date);data.itinerary=data.itinerary.filter(i=>i.date!==date);commit('日期與當日行程已刪除',before);openDates();}

function savePerson(form){const name=new FormData(form).get('name').trim();if(!name){formError('請輸入旅伴的名字。');return;}if(data.people.some(p=>p.name===name&&p.id!==modalItemId)){formError('已有同名旅伴，請加上能區分的暱稱。');return;}if(data.people.length>=100&&!modalItemId){formError('最多可建立 100 位旅伴。');return;}const p=data.people.find(p=>p.id===modalItemId);if(p)p.name=name;else data.people.push({id:uid(),name});closeSheet(true);commit('旅伴已更新');}

let photoDraft='',photoDraftPath='',photoTouched=false,expenseSaving=false,photoProcessing=false,photoSequence=0;

 openSheet(id?'編輯支出':'新增支出',`<form id="expense-form">${field('date','日期',e.date,'date','required')}<div class="form-section">${field('title','支出項目',e.title,'text','required maxlength="300" placeholder="例如：晚餐、交通卡加值"')}</div><div class="grid2 form-section"><label><span class="field-label">幣別</span><select name="currency" id="expense-currency" class="field"><option value="JPY" ${e.currency==='JPY'?'selected':''}>日圓 JPY</option><option value="TWD" ${e.currency==='TWD'?'selected':''}>台幣 TWD</option></select></label>${field('amount','總金額',e.amount,'number',`required min="${e.currency==='TWD'?'.01':'1'}" max="1000000000" step="${e.currency==='TWD'?'.01':'1'}" inputmode="decimal" placeholder="0"`)}</div><label class="block form-section"><span class="field-label">誰先付？</span><select class="field" name="payer" required>${data.people.map(p=>`<option value="${esc(p.id)}" ${p.id===e.payer?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><div class="form-section"><div class="row between"><span class="field-label" style="margin:0">哪些人一起分？</span><button type="button" class="text-btn" data-action="all-participants">全選</button></div><div class="participants">${data.people.map(p=>`<label><input type="checkbox" name="involved" value="${esc(p.id)}" ${e.involved.includes(p.id)?'checked':''}>${esc(p.name)}</label>`).join('')}</div><p class="help">依勾選的人平均分攤；付款人也可不參與分攤。</p></div><label class="block form-section"><span class="field-label">備註</span><textarea class="field" name="note" rows="2" maxlength="10000" placeholder="留下一點這筆支出的細節…">${esc(e.note)}</textarea></label><label class="block form-section"><span class="field-label">收據或照片 <em>選填</em></span><input type="file" id="expense-photo" class="field" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></label><div id="photo-draft">${renderPhotoDraft()}</div><p class="help">照片會縮小後儲存。網路中斷時，仍可先記帳。</p>${errorBox()}<div class="sheet-actions">${id?`<button type="button" class="btn danger" data-action="delete-expense" data-id="${esc(id)}" aria-label="刪除支出">${icon('trash')}</button>`:''}<button type="submit" id="expense-save" class="btn primary">${id?'儲存變更':'加入分帳'}</button></div></form>`,'expense');modalItemId=id;

function renderPhotoDraft(){const src=photoDraft||photoUrls.get(photoDraftPath);return src?`<img class="photo-preview" alt="照片預覽" src="${esc(src)}"><button type="button" class="text-btn" data-action="remove-photo">移除照片</button>`:photoDraftPath?'<p class="help">已附有雲端照片；可重新連線載入。</p><button type="button" class="text-btn" data-action="remove-photo">移除照片</button>':'';}
async function compressPhoto(file){if(file.size>15*1024*1024)throw Error('照片請小於 15 MB。');if(!/^image\//.test(file.type))throw Error('請選擇照片檔案。');const u=URL.createObjectURL(file);try{const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('無法讀取照片，請改用 JPG、PNG 或 WebP。'));image.src=u;});const scale=Math.min(1,1200/Math.max(image.naturalWidth,image.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(image.naturalWidth*scale));c.height=Math.max(1,Math.round(image.naturalHeight*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(image,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.76);}finally{URL.revokeObjectURL(u);}}
async function pickPhoto(file){if(!file)return;const seq=++photoSequence;photoProcessing=true;const save=$('#expense-save');save.disabled=true;save.textContent='照片處理中…';try{const img=await compressPhoto(file);if(seq!==photoSequence||modalType!=='expense')return;photoDraft=img;photoDraftPath='';photoTouched=true;modalDirty=true;$('#photo-draft').innerHTML=renderPhotoDraft();}catch(e){formError(e.message);}finally{if(seq===photoSequence){photoProcessing=false;const btn=$('#expense-save');if(btn){btn.disabled=false;btn.textContent=modalItemId?'儲存變更':'加入分帳';}}}}
async function saveExpense(form){if(expenseSaving||photoProcessing)return;const f=new FormData(form),currency=f.get('currency'),amount=Number(f.get('amount')),involved=f.getAll('involved');if(!f.get('title').trim()||!validDate(f.get('date'))){formError('請填入有效日期與支出項目。');return;}if(!Number.isFinite(amount)||amount<=0||amount>1e9||!involved.length){formError('請填入有效金額，並至少勾選一位分攤旅伴。');return;}const scale=currency==='JPY'?1:100;if(Math.abs(amount*scale-Math.round(amount*scale))>1e-6){formError(currency==='JPY'?'日圓請使用整數。':'台幣金額最多兩位小數。');return;}if(!data.people.some(p=>p.id===f.get('payer'))||involved.some(id=>!data.people.some(p=>p.id===id))){formError('旅伴資料已變更，請重新開啟這筆支出。');return;}
 const record={id:modalItemId||uid(),date:f.get('date'),title:f.get('title').trim(),currency,amount,note:f.get('note').trim(),payer:f.get('payer'),involved,photo:photoDraft,photoPath:photoDraftPath};const n=data.expenses.findIndex(e=>e.id===record.id);if(n>=0)data.expenses[n]=record;else data.expenses.unshift(record);closeSheet(true);commit(n>=0?'支出已更新，分帳也重算了。':'支出已記下。');
}
async function deleteExpense(id){const e=data.expenses.find(e=>e.id===id);if(!e||!await ask('刪除這筆支出？',`「${e.title}」${money(e.amount,e.currency)} 刪除後，分帳會重新計算。`,'刪除支出'))return;const before=clone(data);data.expenses=data.expenses.filter(e=>e.id!==id);closeSheet(true);commit('支出已刪除',before);}

除瀏覽資料前，請先匯出；跨裝置也可使用雲端同步。</p>${storageError||rescueSaved?'<button class="btn danger full form-section" data-action="raw-backup">救援：匯出原始裝置資料</button>':''}</div><div class="notice form-section">離線可編輯行程、購物與分帳；天氣、地圖和雲端同步需要網路。</div>`,'settings');}
function download(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}

function exportCSV(){const cell=v=>'"'+String(v??'').replace(/^[=+\-@\t\r]/,"'$&").replace(/"/g,'""')+'"',rows=[['日期','支出項目','幣別','金額','付款人','分攤旅伴','備註'],...data.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>[e.date,e.title,e.currency,e.amount,personName(e.payer),e.involved.map(personName).join('、'),e.note])];download('旅行支出-'+localDate()+'.csv','\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('支出 CSV 已匯出');}
async function importFile(file){if(!file)return;try{if(file.size>12*1024*1024)throw Error('備份檔案請小於 12 MB。');const json=JSON.parse(await file.text()),incoming=normalize(json.data||json);if(!await ask('匯入這份旅行備份？',`${incoming.city} · ${incoming.days.length} 天 · ${incoming.itinerary.length} 個行程 · ${incoming.expenses.length} 筆支出\n\n這會取代目前旅行。先自動下載現有資料備份，再套用；已連線時也會同步到雲端。`,'備份並匯入'))return;backupData(data,'-匯入前');data=incoming;ui.date=data.days[0].date;ui.search='';weatherKey='';closeSheet(true);commit('備份已匯入');}catch(e){toast('匯入失敗：'+(e instanceof SyntaxError?'JSON 檔案格式不正確。':e.message));}finally{$('#import-file').value='';}}
document.addEventListener('click',async ev=>{const el=ev.target.closest('[data-action]');if(!el||el.disabled||el.matches('input'))return;const a=el.dataset.action,id=el.dataset.id;
 try{switch(a){
 case 'tab':ui.tab=el.dataset.tab;ui.search='';render();window.scrollTo({top:0,behavior:'instant'});break;
 case 'date':{const sc=$('.date-scroll'),x=sc?.scrollLeft||0;ui.date=el.dataset.date;ui.search='';render();const n=$('.date-scroll');if(n)n.scrollLeft=x;break;}

async function fetchJSON(url,options={},timeout=12000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const res=await fetch(url,{...options,signal:ctl.signal});let body;try{body=await res.json();}catch{throw Error('伺服器回應格式不正確。');}if(!res.ok)throw Error(res.status===401||res.status===403?'旅行 ID 或密碼不正確，或目前沒有存取權限。':body.message||body.error||'服務暫時無法連線。');return body;}catch(e){if(e.name==='AbortError')throw Error('連線逾時；變更仍保存在此裝置，稍後可重試。');if(e instanceof TypeError)throw Error('目前無法連線雲端，請確認網路後再試。');throw e;}finally{clearTimeout(timer);}}
async function rpc(name,args){return fetchJSON(SUPABASE_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});}

async function connectTrip(id,password,mode,button=null){
 if(cloud.busy)return false;
 if(storageConflict){toast('此分頁有尚未處理的資料衝突，請先匯出備份。');return false;}
 if(modalDirty&&modalType!=='connect'){toast('請先儲存目前正在編輯的內容，再連線旅行。');return false;}
 if(!/^[a-z0-9_-]{3,80}$/.test(id)||typeof password!=='string'||password.length<6){formError('請填入有效的旅行 ID 與密碼。');return false;}
 if(!navigator.onLine){toast('目前離線，恢復網路後請重新開啟同步連結。');return false;}
 if(button){button.disabled=true;button.textContent='連線中…';}cloud.busy=true;renderStatus();const generation=++cloud.generation;
 try{
  const startRevision=revision;let remote;
  if(mode==='create'){const snapshot=clone(data);const created=await rpc('create_trip',{p_trip_id:id,p_password:password,p_data:snapshot});if(!created)throw Error('這個旅行 ID 已被使用，請改用其他 ID，或連線既有旅行。');remote=snapshot;}
  else{remote=await rpc('load_trip',{p_trip_id:id,p_password:password});if(remote===null)throw Error('找不到旅行，或密碼不正確。請確認後重試。');}
  if(generation!==cloud.generation)return false;
  if(modalDirty&&modalType!=='connect')throw Error('連線期間有尚未儲存的編輯，請先儲存，再重新連線。');
  const normalized=normalize(remote),remoteText=stable(normalized);
  if(!saveLocal())throw Error('目前修改尚未安全存到裝置，已取消切換；請先匯出備份。');
  const same=slot==='trip:'+id;
  const cache=same||mode==='create'?{data:clone(data),dirty,base}:cachedTrip(id);
  const keep=cache&&stable(cache.data)!==remoteText&&(cache.dirty||!cache.base||(mode==='create'&&revision!==startRevision));
  slot='trip:'+id;cloud.id=id;cloud.password=password;cloud.error='';cloud.conflict=null;
  storageSet(STORE+':active',slot);storageSet(STORE+':session',stable({id,password}));storageSet('trip-cloud-id',id);storageSet('trip-cloud-pw',password);
  if(keep){data=cache.data;dirty=true;base=mode==='create'?remoteText:cache.base||'';if(base!==remoteText)cloud.conflict={remote:normalized,remoteText};}
  else{data=normalized;dirty=false;base=remoteText;}
  revision++;undo=null;ui.date=data.days[0].date;ui.mapQuery=data.city;weatherKey='';saveLocal();
  if(modalType==='connect')closeSheet(true);render();
  if(cloud.conflict)openConflict();else toast(dirty?'已連線，保留本機尚未同步的修改':'已連線「'+id+'」');refreshPhotos();return true;
 }catch(e){cloud.error=e.message;if(button)formError(e.message);else toast(e.message);return false;}
 finally{if(generation===cloud.generation){cloud.busy=false;renderStatus();if(dirty&&!cloud.conflict&&cloud.password&&!storageConflict)saveTimer=setTimeout(()=>syncCloud(),900);}if(button?.isConnected){button.disabled=false;button.textContent='連線旅行';}}
}
async function saveCloudChecked(args,snapshot,expected){

 catch(e){if(/save_trip_checked|schema cache|PGRST202/i.test(e.message))throw Error('雲端尚未啟用新版同步保護。修改已留在此裝置；請先在 Supabase 執行隨附的同步更新 SQL。');throw e;}

async function syncCloud(manual=false){if(!cloud.password||!cloud.id||cloud.busy||storageConflict)return;if(cloud.conflict){if(manual)openConflict();return;}if(!navigator.onLine){renderStatus();if(manual)toast('目前離線，恢復網路後會重試。');return;}if(modalDirty||($('#sheet').open&&modalType!=='settings'))return;

 try{const raw=await rpc('load_trip',args);if(generation!==cloud.generation)return;if(raw===null)throw Error('雲端旅行無法讀取，請重新連線確認密碼。');const remote=normalize(raw),remoteText=stable(remote);if(modalDirty)return;

 }catch(e){if(generation===cloud.generation){cloud.error=e.message;if(manual)toast(e.message);}}

}

async function switchLocal(){if(cloud.busy){toast('同步中，請稍候。');return;}if(!await ask('切換到本機旅行？','目前旅行與尚未同步變更會保留；之後可用同一組 ID 與密碼重新連線。','切換'))return;saveLocal();clearTimeout(saveTimer);cloud.generation++;const generation=cloud.generation;cloud={id:'',password:'',state:'local',busy:false,conflict:null,error:'',generation};storageRemove(STORE+':session');storageRemove('trip-cloud-pw');slot='local';storageSet(STORE+':active',slot);const saved=storageGet(cacheKey());data=makeDefault();dirty=false;base='';if(saved){try{const c=JSON.parse(saved);data=normalize(c.data);dirty=!!c.dirty;base=rebase(c.base);}catch{toast('無法讀取本機快取，原始內容仍保留。');}}revision++;undo=null;ui.date=data.days[0].date;weatherKey='';closeSheet(true);render();}
async function refreshPhotos(){if(!cloud.password)return;const generation=cloud.generation,paths=[...new Set(data.expenses.filter(e=>e.photoPath&&!e.photo).map(e=>e.photoPath))];for(let n=0;n<paths.length;n+=4){await Promise.all(paths.slice(n,n+4).map(async path=>{try{const result=await fetchJSON(SUPABASE_URL+'/functions/v1/trip-photo',{method:'POST',headers:{'Content-Type':'application/json',apikey:SUPABASE_PUBLISHABLE_KEY},body:JSON.stringify({tripId:cloud.id,password:cloud.password,action:'view',path})});if(generation===cloud.generation&&typeof result.url==='string'&&/^https:\/\//.test(result.url))photoUrls.set(path,result.url);}catch{}}));}if(generation===cloud.generation&&ui.tab==='split'&&!modalDirty)render();}
function weatherInfo(code){if(code===0)return ['☀️','晴朗'];if([1,2].includes(code))return ['🌤️','晴時多雲'];if(code===3)return ['☁️','多雲'];if([45,48].includes(code))return ['🌫️','有霧'];if([51,53,55,56,57].includes(code))return ['🌦️','毛毛雨'];if([61,63,65,66,67,80,81,82].includes(code))return ['🌧️','有雨'];if([71,73,75,77,85,86].includes(code))return ['🌨️','有雪'];if([95,96,99].includes(code))return ['⛈️','雷雨'];return ['☁️','天氣預報'];}
function weatherNum(v,suffix='°'){return v==null||!Number.isFinite(Number(v))?'—':Math.round(Number(v))+suffix;}
function renderWeather(){let body;if(weather.status==='ready'){body=`<div class="weather-main"><div class="weather-icon">${weather.icon}</div><div class="weather-copy"><b class="small">${esc(weather.label)}</b><div class="weather-label">${esc(weather.location)} · 中午預報</div></div><span class="weather-temp">${weatherNum(weather.temp)}</span></div><div class="weather-detail"><div>最高 ${weatherNum(weather.max)} / 最低 ${weatherNum(weather.min)}</div><div>降雨 ${weatherNum(weather.rain,'%')}</div></div><div class="help weather-credit">Open-Meteo · ${dateText(ui.date)}，日本時間</div>`;}else{body=`<div class="weather-main"><div class="weather-icon">${weather.status==='past'?'🗓️':'☁️'}</div><div class="weather-copy"><b class="small">${weather.status==='loading'?'正在查看天氣':weather.status==='far'?'天氣，出發前再看':weather.status==='past'?'這一天已經過了':weather.status==='error'?'暫時無法取得天氣':'旅行天氣'}</b><p class="weather-label">${esc(weather.message||'接近旅行日期時，會顯示逐日預報。')}</p></div>${weather.status==='error'?'<button class="icon-btn" data-action="weather-retry" aria-label="重新取得天氣">'+icon('refresh')+'</button>':''}</div>`;}return `<div class="card-title"><span>${icon('sun')}</span><h3>這一天的天氣</h3></div>${body}`;}
function updateWeather(value){weather=value;const el=$('#weather');if(el)el.innerHTML=renderWeather();}
async function loadWeather(){const key=data.city+'|'+ui.date;if(weatherKey===key)return;weatherKey=key;const token=++weatherToken;weatherAbort?.abort();const diff=Math.round((Date.parse(ui.date)-Date.parse(localDate()))/86400000);if(diff<0){updateWeather({status:'past',message:'過去日期不顯示即時預報。'});return;}if(diff>15){updateWeather({status:'far',message:'這一天尚未進入約 16 天的預報範圍。'});return;}if(!navigator.onLine){updateWeather({status:'error',message:'目前離線，恢復網路後可重新查詢。'});return;}const cached=weatherCache.get(key);if(cached&&Date.now()-cached.saved<1800000){updateWeather(cached.value);return;}updateWeather({status:'loading',message:'查詢所選城市與日期…'});weatherAbort=new AbortController();const ctl=weatherAbort,timer=setTimeout(()=>ctl.abort(),10000),city=data.city,date=ui.date;
 try{const known={'大阪':[34.6937,135.5023,'大阪'],'大阪市':[34.6937,135.5023,'大阪'],'東京':[35.6762,139.6503,'東京'],'京都':[35.0116,135.7681,'京都'],'福井':[36.0641,136.2196,'福井'],'札幌':[43.0618,141.3545,'札幌'],'福岡':[33.5902,130.4017,'福岡'],'沖繩':[26.2124,127.6809,'那霸'],'那霸':[26.2124,127.6809,'那霸'],'名古屋':[35.1815,136.9066,'名古屋']};let loc=known[city.trim()];if(!loc){const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=10&language=zh&format=json',{signal:ctl.signal});if(!r.ok)throw Error('城市查詢暫時不可用。');const g=await r.json(),m=g.results?.find(x=>x.country_code==='JP');if(!m)throw Error('找不到日本城市，請在旅行設定填入單一城市名稱。');loc=[m.latitude,m.longitude,m.name];}
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc[0]}&longitude=${loc[1]}&timezone=Asia%2FTokyo&forecast_days=16&hourly=temperature_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max`,{signal:ctl.signal});if(!r.ok)throw Error('預報服務暫時不可用。');const w=await r.json();if(token!==weatherToken)return;const n=w.daily?.time?.indexOf(date),h=w.hourly?.time?.indexOf(date+'T12:00');if(n==null||n<0)throw Error('這一天目前尚無預報資料。');const [ic,label]=weatherInfo(w.daily.weather_code[n]),value={status:'ready',icon:ic,label,location:loc[2],temp:h>=0?w.hourly.temperature_2m[h]:null,max:w.daily.temperature_2m_max[n],min:w.daily.temperature_2m_min[n],rain:w.daily.precipitation_probability_max[n]};weatherCache.set(key,{saved:Date.now(),value});updateWeather(value);
 }catch(e){if(token!==weatherToken)return;updateWeather({status:'error',message:e.name==='AbortError'?'查詢逾時，可稍後再試。':e instanceof TypeError?'請確認網路，或稍後重新查詢。':e.message});}finally{clearTimeout(timer);}
}
/* Other tabs never overwrite an unseen local change. */
window.addEventListener('storage',ev=>{if(ev.key!==cacheKey()||!ev.newValue)return;try{const c=JSON.parse(ev.newValue),incoming=normalize(c.data);if(stable(incoming)===stable(data)){localSeen.set(ev.key,ev.newValue);return;}if(modalDirty||dirty){storageConflict=true;storageError='另一個分頁已更新這趟旅行，已暫停覆寫。請先匯出此分頁備份，再重新整理。';renderStatus();return;}data=incoming;dirty=!!c.dirty;base=rebase(c.base);localSeen.set(ev.key,ev.newValue);revision++;undo=null;render();toast('已讀取另一個分頁的更新');}catch{}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloud.password)syncCloud();});
setInterval(()=>{if(document.visibilityState==='visible'&&cloud.password)syncCloud();},45000);
render();
if(!storageGet(cacheKey())&&!storageError)saveLocal();
if(initMessage)toast(initMessage);
autoConnectFromLink();
try{const session=JSON.parse(storageGet(STORE+':session')||'null'),legacyPassword=storageGet('trip-cloud-pw');if(session&&session.id===cloud.id&&session.password){cloud.password=session.password;syncCloud();refreshPhotos();}else if(cloud.id&&legacyPassword){cloud.password=legacyPassword;storageSet(STORE+':session',stable({id:cloud.id,password:legacyPassword}));syncCloud();refreshPhotos();}}catch{}
